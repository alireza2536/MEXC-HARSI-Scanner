<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>اسکن لحظه‌ای MEXC</title>
  <style>
    :root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#0b1220;color:#e5edf8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at top,#172b47 0,#0b1220 55%)}
    main{max-width:900px;margin:0 auto}.panel{background:#111c2d;border:1px solid #26364d;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #0003}
    h1{font-size:22px;margin:0 0 10px;text-align:center}.muted{color:#9fb0c7;font-size:14px;line-height:1.9}
    button{width:100%;border:0;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700;color:#061321;background:#60d5b2;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}.status{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;margin:14px 0;text-align:center}
    .dot{width:10px;height:10px;border-radius:50%;background:#8493a8}.running .dot{background:#f6bd4b;box-shadow:0 0 0 5px #f6bd4b22}
    .completed .dot{background:#60d5b2}.failed .dot{background:#ff7777}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
    .stat{background:#0b1422;border-radius:12px;padding:14px}.stat strong{display:block;font-size:22px;margin-bottom:5px}
    .stat span{font-size:12px;color:#9fb0c7}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:right;padding:12px 10px;border-bottom:1px solid #26364d;font-size:13px}th{color:#9fb0c7}
    .ha-sort-toggle{width:32px;height:32px;padding:0;margin-right:6px;border-radius:8px;background:#26364d;color:#e5edf8;font-size:20px;line-height:1;vertical-align:middle}
    .ha-sort-toggle:hover{background:#354862}
    .error{color:#ff9999;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}
    .ha-filter{margin-bottom:16px;padding:14px;background:#0b1422;border:1px solid #26364d;border-radius:14px}
    .ha-filter-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .ha-filter label{display:block;color:#9fb0c7;font-size:12px;margin-bottom:7px;text-align:center}
    .ha-filter input{width:100%;min-width:0;background:#172438;color:#e5edf8;border:1px solid #354862;border-radius:10px;padding:12px;text-align:center;font:inherit;font-size:16px;direction:ltr}
    .ha-filter-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
    .ha-filter-actions button{padding:11px 14px;font-size:14px}
    .ha-filter-actions .secondary{background:#26364d;color:#e5edf8}
    #filterMessage{margin:10px 0 0;text-align:center;font-size:12px;color:#9fb0c7;min-height:18px}
    @media(max-width:540px){.ha-filter{padding:12px}.ha-filter-actions{grid-template-columns:1fr 1fr}}

    .ha-topbar{display:flex;align-items:center;justify-content:center;position:relative;min-height:42px;margin-bottom:10px}
    .ha-topbar h1{margin:0}
    .ha-menu button{margin:4px 0;padding:12px;font-size:14px}
    @media(max-width:540px){body{padding:12px}.panel{padding:16px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:18px}h1{font-size:19px}}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <div class="ha-topbar">
      <h1>اسکن لحظه‌ای MEXC</h1>
      </div>
    </div>
    <button id="refresh">بروزرسانی</button>
    <div id="status" class="status"><span class="dot"></span><span>آماده بروزرسانی</span></div>
    <p id="message" class="muted" aria-live="polite" style="text-align:center">برای شروع اسکن، دکمه بروزرسانی را بزنید.</p>
    <div class="stats">
      <div class="stat"><strong id="eligible">—</strong><span>ارز</span></div>
      <div class="stat"><strong id="updated">—</strong><span>بروز شده</span></div>
      <div class="stat"><strong id="failed">—</strong><span>خطا</span></div>
    </div>
    <p id="error" class="error"></p>
  </section>
  <section class="panel">
    <div class="ha-filter" aria-label="محدوده نمایش بر اساس مقدار">
      <div class="ha-filter-fields">
        <div><label for="filterFrom">از مقدار</label><input id="filterFrom" type="text" inputmode="text" autocomplete="off" spellcheck="false" dir="ltr" value="4" placeholder="مثلاً -5"></div>
        <div><label for="filterTo">تا مقدار</label><input id="filterTo" type="text" inputmode="text" autocomplete="off" spellcheck="false" dir="ltr" value="20" placeholder="مثلاً 10"></div>
      </div>
      <div class="ha-filter-actions">
        <button id="applyFilter" type="button">اعمال فیلتر</button>
        <button id="clearFilter" class="secondary" type="button">حذف فیلتر</button>
      </div>
      <p id="filterMessage" aria-live="polite">دو مقدار دلخواه وارد کنید؛ مثبت و منفی پذیرفته می‌شود.</p>
    </div>
    <div class="table-wrap">
      <table style="min-width:0"><thead><tr><th>مقدار <button id="haSort" class="ha-sort-toggle" type="button" aria-label="مرتب‌سازی صعودی" title="مرتب‌سازی صعودی">↑</button></th><th>نام ارز</th></tr></thead>
      <tbody id="rows"><tr><td colspan="2" class="muted">هنوز داده‌ای دریافت نشده است.</td></tr></tbody></table>
    </div>
  </section>
</main>
<script>
const button=document.getElementById("refresh");
const statusEl=document.getElementById("status");
const message=document.getElementById("message");
const errorEl=document.getElementById("error");
const rows=document.getElementById("rows");
const filterFrom=document.getElementById("filterFrom");
const filterTo=document.getElementById("filterTo");
const filterMessage=document.getElementById("filterMessage");
const applyFilterButton=document.getElementById("applyFilter");
const clearFilterButton=document.getElementById("clearFilter");
const haSort=document.getElementById("haSort");
let sortDirection="asc";
let latestResults=[];
let activeRange=null;
let latestProgress=null;
const fmt=(value)=>value===null||value===undefined?"—":Number(value).toLocaleString("en-US",{maximumFractionDigits:8});
const fmtHa=(value)=>value===null||value===undefined?"—":Number(value).toFixed(1);
function renderRows(){
  rows.replaceChildren();
  const filteredResults=activeRange
    ? latestResults.filter(item=>{
        const value=Number(item.haClose);
        return item.haClose!==null&&item.haClose!==undefined&&Number.isFinite(value)&&value>=activeRange.min&&value<=activeRange.max;
      })
    : latestResults;
  const results=[...filteredResults].sort((a,b)=>{
    const difference=Number(a.haClose)-Number(b.haClose);
    return sortDirection==="asc"?difference:-difference;
  });
  for(const item of results){
    const tr=document.createElement("tr");
    for(const value of [fmtHa(item.haClose),String(item.symbol||"").replace(/(?:_|-)??USDT$/i,"")]){
      const td=document.createElement("td");td.textContent=value;tr.append(td);
    }
    rows.append(tr);
  }
  if(!results.length){
    const tr=document.createElement("tr");
    const td=document.createElement("td");td.colSpan=2;td.className="muted";
    td.textContent=latestResults.length?"مقداری در این بازه پیدا نشد.":"مقداری برای نمایش وجود ندارد.";
    tr.append(td);rows.append(tr);
  }
  if(activeRange){
    filterMessage.textContent="نمایش "+results.length+" از "+latestResults.length+" ارز | بازه: "+fmt(activeRange.min)+" تا "+fmt(activeRange.max);
  }else{
    filterMessage.textContent="فیلتر غیرفعال است؛ "+latestResults.length+" ارز نمایش داده می‌شود.";
  }
}
haSort.addEventListener("click",()=>{
  sortDirection=sortDirection==="asc"?"desc":"asc";
  haSort.textContent=sortDirection==="asc"?"↑":"↓";
  const directionLabel=sortDirection==="asc"?"صعودی":"نزولی";
  haSort.setAttribute("aria-label","مرتب‌سازی "+directionLabel);
  haSort.title="مرتب‌سازی "+directionLabel;
  renderRows();
});
function normalizeNumericInput(value){
  return String(value).trim()
    .replace(/[۰-۹]/g, digit => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit)))
    .replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)))
    .replace(/[−–]/g, "-")
    .replace(/٫/g, ".");
}
applyFilterButton.addEventListener("click",()=>{
  const fromText=normalizeNumericInput(filterFrom.value),toText=normalizeNumericInput(filterTo.value);
  if(fromText===""||toText===""){
    filterMessage.textContent="لطفاً هر دو مقدار «از» و «تا» را وارد کنید.";
    return;
  }
  const from=Number(fromText),to=Number(toText);
  if(!Number.isFinite(from)||!Number.isFinite(to)){
    filterMessage.textContent="هر دو مقدار باید عدد معتبر باشند.";
    return;
  }
  activeRange={min:Math.min(from,to),max:Math.max(from,to)};
  renderRows();
});
clearFilterButton.addEventListener("click",()=>{
  activeRange=null;filterFrom.value="";filterTo.value="";
  renderRows();
});
function render(job){
  statusEl.className="status "+(job.status||"");
  const labels={idle:"آماده بروزرسانی",running:"در حال دریافت داده",completed:"بروزرسانی با موفقیت تمام شد",failed:"بروزرسانی با خطا متوقف شد",paused:"اسکن متوقف شد"};
  statusEl.lastElementChild.textContent=labels[job.status]||"وضعیت نامشخص";
  const summary=job.summary;
  button.disabled=false;
  button.textContent=job.status==="running"?"لغو بروزرسانی":"بروزرسانی";
  button.setAttribute("aria-label",button.textContent);
  if(job.progress){
    latestProgress=job.progress;
    document.getElementById("eligible").textContent=fmt(job.progress.total);
    document.getElementById("updated").textContent=fmt(job.progress.updated);
    document.getElementById("failed").textContent=fmt(job.progress.failed);
    message.textContent="پردازش: "+fmt(job.progress.processed)+" از "+fmt(job.progress.total)+
      " | باقی‌مانده: "+fmt(job.progress.remaining);
    if(Array.isArray(job.progress.results)){
      latestResults=job.progress.results;
      renderRows();
    }
  }
  if(summary&&!job.progress){
    document.getElementById("eligible").textContent=fmt(summary.eligibleContracts);
    document.getElementById("updated").textContent=fmt(summary.updatedContracts);
    document.getElementById("failed").textContent=fmt(summary.failedContracts);
    message.textContent="آخرین بروزرسانی: "+new Date(summary.completedAt).toLocaleString("fa-IR");
    latestResults=Array.isArray(summary.results)?summary.results:[];
    latestProgress=null;
    renderRows();
  }
  errorEl.textContent=job.error||"";
  if(job.status==="running"&&!job.progress) message.textContent="اسکن پس از زدن دکمه بروزرسانی ادامه می‌یابد؛ حتی اگر از برنامه خارج شوید یا صفحه گوشی خاموش شود.";
  if(job.status==="paused") message.textContent="اسکن متوقف شد. برای شروع دوباره، دکمه بروزرسانی را بزنید.";
  if(job.status==="idle"&&!summary) message.textContent="برای شروع اسکن، دکمه بروزرسانی را بزنید.";
}
window.localHarsiRender=render;
const nativeApp=Boolean(window.Capacitor?.isNativePlatform?.());
async function refreshStatus(){
  if(nativeApp){
    if(window.localHarsiBridge) render(window.localHarsiBridge.getStatus());
    return;
  }
  try{const response=await fetch("/api/status",{cache:"no-store"});render(await response.json());}
  catch{message.textContent="ارتباط با سرور برقرار نشد. صفحه را دوباره بارگذاری کنید.";}
}

button.addEventListener("click",async()=>{
  errorEl.textContent="";
  try{
    if(nativeApp){
      const bridge=await window.localHarsiReady;
      if(bridge.getStatus().status==="running"){
        await bridge.cancelNow();
        return;
      }
      button.disabled=true;
      render(await bridge.refreshNow());
      return;
    }
    button.disabled=true;
    const response=await fetch("/api/refresh",{method:"POST"});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"شروع بروزرسانی ناموفق بود.");
    render(data.job);
  }catch(error){errorEl.textContent=error.message;button.disabled=false;}
});
refreshStatus();
if(!nativeApp) setInterval(refreshStatus,3000);
</script>
<script type="module" src="./android-app.js"></script>
</body>
</html>
