<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>اسکن لحظه‌ای MEXC</title>
  <style>
    :root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#0b1220;color:#e5edf8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at top,#172b47 0,#0b1220 55%)}
    main{max-width:900px;margin:0 auto}.panel{background:#111c2d;border:1px solid #26364d;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #0003}
    h1{font-size:22px;margin:0 0 10px;text-align:center}.muted{color:#9fb0c7;font-size:14px;line-height:1.9}
    button{width:100%;border:0;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700;color:#061321;background:#60d5b2;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    #refresh,#applyFilter{color:#fff;background:#1E3A8A}
    .timeframe-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
    .timeframe-picker button{background:#26364d;color:#e5edf8;border:1px solid #40536d}
    .timeframe-picker button.active{background:#1E3A8A;border-color:#1E3A8A;color:#fff}
    .timeframe-picker button:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
    #refresh.is-cancel,#applyFilter.is-remove{background:#9F1239}
    .progress-track{height:9px;margin:18px 0 9px;background:#26364d;border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;width:0;background:#16a36a;border-radius:999px;transition:width .25s ease}
    .progress-details{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
    #message{margin:0;color:#e5edf8;text-align:right;font-size:15px}
    #errorCount{color:#ff9999;white-space:nowrap;font-weight:700;font-size:15px}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0}th,td{width:33.333%;text-align:center;padding:12px 8px;border-bottom:1px solid #26364d;font-size:13px;font-variant-numeric:tabular-nums}th{color:#9fb0c7}th:first-child,td:first-child{ text-align:center }
    #rows td.coin-card-cell{width:100%;padding:3px 4px;border-bottom:0}
    .coin-card{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:4px;padding:7px 3px;border:1px solid #26364d;border-radius:8px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
    .coin-card.alt{background:#26364d}
    .coin-card > span{min-width:0;text-align:center}
    .ha-sort-toggle{width:32px;height:32px;padding:0;margin-right:6px;border-radius:8px;background:#26364d;color:#e5edf8;font-size:20px;line-height:1;vertical-align:middle}
    .ha-sort-toggle:hover{background:#354862}
    .error{color:#ff9999;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;font-size:15px}
    .ha-filter{margin-bottom:16px;padding:14px;background:#0b1422;border:1px solid #26364d;border-radius:14px}
    .ha-filter-fields{display:grid;grid-template-columns:1fr;gap:12px}
    .ha-filter-row{display:grid;grid-template-columns:.7fr 1fr 1fr;gap:10px;align-items:center}
    .ha-filter-timeframe{display:flex;align-items:center;justify-content:center;color:#e5edf8;font-size:14px;font-weight:700;text-align:center;padding:12px 2px;transform:translateY(14px)}
    .ha-filter label{display:block;color:#9fb0c7;font-size:12px;margin-bottom:7px;text-align:center;visibility:hidden}
    .ha-filter input{width:100%;min-width:0;background:#172438;color:#e5edf8;border:1px solid #354862;border-radius:10px;padding:12px;text-align:center !important;font:inherit;font-size:16px;direction:ltr;font-variant-numeric:tabular-nums}
    .ha-filter-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
    .ha-filter-actions button{padding:11px 14px;font-size:14px}
    #filterMessage{margin:10px 0 0;text-align:center;font-size:12px;color:#9fb0c7;min-height:18px}
    @media(max-width:540px){.ha-filter{padding:12px}}

    .ha-topbar{display:flex;align-items:center;justify-content:center;position:relative;min-height:42px;margin-bottom:10px}
    .ha-topbar h1{margin:0}
    .ha-menu button{margin:4px 0;padding:12px;font-size:14px}
    @media(max-width:540px){body{padding:12px}.panel{padding:16px}h1{font-size:19px}.progress-details,#message,#errorCount,.error{font-size:14px}}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <div class="ha-topbar">
      <h1>اسکن لحظه‌ای MEXC</h1>
      </div>
    </div>
    <div class="timeframe-picker" aria-label="انتخاب تایم‌فریم">
      <button id="timeframe1m" type="button" class="active" aria-pressed="true">۱ دقیقه ✓</button>
      <button id="timeframe15m" type="button" class="active" aria-pressed="true">۱۵ دقیقه ✓</button>
    </div>
    <button id="refresh">بروزرسانی</button>
    <div class="progress-track" role="progressbar" aria-label="میزان پردازش" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div class="progress-details" aria-live="polite">
      <p id="message">پردازش: — از —</p>
      <span id="errorCount">خطا: —</span>
    </div>
    <p id="error" class="error"></p>
  </section>
  <section class="panel">
    <div class="ha-filter" aria-label="محدوده نمایش بر اساس مقدار">
      <div class="ha-filter-fields" id="haFilterFields">
        <div class="ha-filter-row" data-timeframe="Min1">
          <span class="ha-filter-timeframe">1m</span>
          <div><input id="filterFrom1m" class="ha-filter-number" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" dir="ltr" value="4"></div>
          <div><input id="filterTo1m" class="ha-filter-number" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" dir="ltr" value="20"></div>
        </div>
        <div class="ha-filter-row" data-timeframe="Min15">
          <span class="ha-filter-timeframe">15m</span>
          <div><input id="filterFrom15m" class="ha-filter-number" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" dir="ltr" value="4"></div>
          <div><input id="filterTo15m" class="ha-filter-number" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" dir="ltr" value="20"></div>
        </div>
      </div>
      <div class="ha-filter-actions">
        <button id="applyFilter" type="button">فیلتر</button>
      </div>
      <p id="filterMessage" aria-live="polite">دو مقدار دلخواه وارد کنید؛ مثبت و منفی پذیرفته می‌شود.</p>
    </div>
    <div class="table-wrap">
      <table><colgroup><col style="width:33.333%"><col style="width:33.333%"><col style="width:33.333%"></colgroup><thead><tr><th>نام ارز</th><th>1m <button id="sort1m" class="ha-sort-toggle" type="button" aria-label="مرتب‌سازی نزولی 1m" title="مرتب‌سازی نزولی 1m">↓</button></th><th>15m <button id="sort15m" class="ha-sort-toggle" type="button" aria-label="مرتب‌سازی نزولی 15m" title="مرتب‌سازی نزولی 15m">↓</button></th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="muted">هنوز داده‌ای دریافت نشده است.</td></tr></tbody></table>
    </div>
  </section>
</main>
<script>
const button=document.getElementById("refresh");
const timeframe1m=document.getElementById("timeframe1m");
const timeframe15m=document.getElementById("timeframe15m");
const selectedTimeframes=new Set(["Min1","Min15"]);
function updateTimeframeButtons(){
  for(const [element,value,label] of [[timeframe1m,"Min1","۱ دقیقه"],[timeframe15m,"Min15","۱۵ دقیقه"]]){
    const active=selectedTimeframes.has(value);
    element.classList.toggle("active",active);
    element.setAttribute("aria-pressed",String(active));
    element.textContent=label+(active?" ✓":"");
  }
}
timeframe1m.addEventListener("click",()=>{selectedTimeframes.has("Min1")?selectedTimeframes.delete("Min1"):selectedTimeframes.add("Min1");updateTimeframeButtons();updateFilterRows();});
timeframe15m.addEventListener("click",()=>{selectedTimeframes.has("Min15")?selectedTimeframes.delete("Min15"):selectedTimeframes.add("Min15");updateTimeframeButtons();updateFilterRows();});
const message=document.getElementById("message");
const progressTrack=document.querySelector(".progress-track");
const progressFill=document.getElementById("progressFill");
const errorCount=document.getElementById("errorCount");
const errorEl=document.getElementById("error");
const rows=document.getElementById("rows");
const filterInputs={
  Min1:{from:document.getElementById("filterFrom1m"),to:document.getElementById("filterTo1m")},
  Min15:{from:document.getElementById("filterFrom15m"),to:document.getElementById("filterTo15m")}
};
const filterRows=[...document.querySelectorAll(".ha-filter-row")];
const filterFields=document.getElementById("haFilterFields");
const filterMessage=document.getElementById("filterMessage");
const applyFilterButton=document.getElementById("applyFilter");
const sort1m=document.getElementById("sort1m");
const sort15m=document.getElementById("sort15m");
function toEnglishDigits(value){
  return String(value??"")
    .replace(/[۰-۹]/g,digit=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit)))
    .replace(/[٠-٩]/g,digit=>String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)));
}
function useEnglishDigits(input){input.value=toEnglishDigits(input.value);}
for(const pair of Object.values(filterInputs)) for(const input of [pair.from,pair.to]){
  input.style.textAlign="center";
  input.addEventListener("input",()=>{useEnglishDigits(input);input.style.textAlign="center";});
  input.addEventListener("focus",()=>{input.value="";input.style.textAlign="center";});
  useEnglishDigits(input);
}
function updateFilterRows(){
  for(const row of filterRows) row.hidden=!selectedTimeframes.has(row.dataset.timeframe);
}
updateFilterRows();
let sortDirections={Min1:"desc",Min15:"desc"};
let sortBy="Min1";
let latestResults=[];
let activeRanges=null;
let latestProgress=null;
const fmt=(value)=>value===null||value===undefined?"—":Number(value).toLocaleString("en-US",{maximumFractionDigits:8});
const fmtHa=(value)=>value===null||value===undefined?"—":Number(value).toFixed(1);
function groupedResults(){
  const bySymbol=new Map();
  for(const item of latestResults){
    const symbol=String(item.symbol||"").replace(/(?:_|-)??USDT$/i,"");
    if(!symbol) continue;
    if(!bySymbol.has(symbol)) bySymbol.set(symbol,{symbol,Min1:null,Min15:null});
    const timeframe=item.timeframe==="Min1"?"Min1":"Min15";
    const value=Number(item.haClose);
    if(item.haClose!==null&&item.haClose!==undefined&&Number.isFinite(value)){
      bySymbol.get(symbol)[timeframe]=value;
    }
  }
  return [...bySymbol.values()];
}
function renderRows(){
  rows.replaceChildren();
  const all=groupedResults();
  let results=activeRanges
    ? all.filter(item=>[...selectedTimeframes].some(timeframe=>{
        const range=activeRanges[timeframe],value=item[timeframe];
        return range&&value!==null&&value>=range.min&&value<=range.max;
      }))
    : all;
  const direction=sortDirections[sortBy];
  results=[...results].sort((a,b)=>{
    const av=a[sortBy],bv=b[sortBy];
    if(av===null&&bv===null)return a.symbol.localeCompare(b.symbol);
    if(av===null)return 1;
    if(bv===null)return -1;
    const difference=av-bv;
    return direction==="asc"?difference:-difference;
  });
  for(const [index,item] of results.entries()){
    const tr=document.createElement("tr");
    const td=document.createElement("td");
    td.colSpan=3;
    td.className="coin-card-cell";
    const card=document.createElement("div");
    card.className="coin-card"+(index%2===0?" alt":"");
    for(const value of [item.symbol,fmtHa(item.Min1),fmtHa(item.Min15)]){
      const cell=document.createElement("span");
      cell.textContent=value;
      card.append(cell);
    }
    td.append(card);
    tr.append(td);
    rows.append(tr);
  }
  if(!results.length){
    const tr=document.createElement("tr");
    const td=document.createElement("td");td.colSpan=3;td.className="muted";
    td.textContent=all.length?"مقداری در این بازه پیدا نشد.":"مقداری برای نمایش وجود ندارد.";
    tr.append(td);rows.append(tr);
  }
  if(activeRanges){
    const ranges=[...selectedTimeframes].filter(tf=>activeRanges[tf]).map(tf=>(tf==="Min1"?"1m":"15m")+": "+fmt(activeRanges[tf].min)+" تا "+fmt(activeRanges[tf].max));
    filterMessage.textContent="نمایش "+results.length+" از "+all.length+" ارز | "+ranges.join(" | ");
  }else{
    filterMessage.textContent="فیلتر غیرفعال است؛ "+all.length+" ارز نمایش داده می‌شود.";
  }
}
function updateSortButton(button,timeframe){
  const direction=sortDirections[timeframe];
  button.textContent=direction==="asc"?"↑":"↓";
  const label="مرتب‌سازی "+(direction==="asc"?"صعودی":"نزولی")+" "+(timeframe==="Min1"?"1m":"15m");
  button.setAttribute("aria-label",label);
  button.title=label;
}
function sortColumn(timeframe){
  if(sortBy===timeframe) sortDirections[timeframe]=sortDirections[timeframe]==="asc"?"desc":"asc";
  sortBy=timeframe;
  updateSortButton(sort1m,"Min1");
  updateSortButton(sort15m,"Min15");
  renderRows();
}
sort1m.addEventListener("click",()=>sortColumn("Min1"));
sort15m.addEventListener("click",()=>sortColumn("Min15"));
updateSortButton(sort1m,"Min1");
updateSortButton(sort15m,"Min15");
function normalizeNumericInput(value){
  return String(value).trim()
    .replace(/[۰-۹]/g, digit => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit)))
    .replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)))
    .replace(/[−–]/g, "-")
    .replace(/٫/g, ".");
}
applyFilterButton.addEventListener("click",()=>{
  if(activeRanges){
    activeRanges=null;
    applyFilterButton.textContent="فیلتر";
    applyFilterButton.classList.remove("is-remove");
    applyFilterButton.setAttribute("aria-label","فیلتر");
    renderRows();
    return;
  }
  if(selectedTimeframes.size===0){
    filterMessage.textContent="حداقل یک تایم‌فریم را انتخاب کنید.";
    return;
  }
  const ranges={};
  for(const timeframe of selectedTimeframes){
    const pair=filterInputs[timeframe];
    const fromText=normalizeNumericInput(pair.from.value),toText=normalizeNumericInput(pair.to.value);
    if(fromText===""||toText===""){
      filterMessage.textContent="لطفاً مقدار «از» و «تا» را برای "+(timeframe==="Min1"?"1m":"15m")+" وارد کنید.";
      return;
    }
    const from=Number(fromText),to=Number(toText);
    if(!Number.isFinite(from)||!Number.isFinite(to)){
      filterMessage.textContent="مقادیر فیلتر باید عدد معتبر باشند.";
      return;
    }
    ranges[timeframe]={min:Math.min(from,to),max:Math.max(from,to)};
  }
  activeRanges=ranges;
  applyFilterButton.textContent="حذف فیلتر";
  applyFilterButton.classList.add("is-remove");
  applyFilterButton.setAttribute("aria-label","حذف فیلتر");
  renderRows();
});
function render(job){
  const summary=job.summary;
  button.disabled=false;
  button.textContent=job.status==="running"?"لغو بروزرسانی":"بروزرسانی";
  button.classList.toggle("is-cancel",job.status==="running");
  button.setAttribute("aria-label",button.textContent);
  let processed=0,total=0,failed=0;
  if(job.progress){
    latestProgress=job.progress;
    processed=Number(job.progress.processed)||0;
    total=Number(job.progress.total)||0;
    failed=Number(job.progress.failed)||0;
    if(Array.isArray(job.progress.results)){
      latestResults=job.progress.results;
      renderRows();
    }
  }else if(summary){
    processed=Number(summary.processedContracts);
    if(!Number.isFinite(processed)) processed=(Number(summary.updatedContracts)||0)+(Number(summary.failedContracts)||0);
    total=Number(summary.eligibleContracts)||0;
    failed=Number(summary.failedContracts)||0;
    latestResults=Array.isArray(summary.results)?summary.results:[];
    latestProgress=null;
    renderRows();
  }
  message.textContent="پردازش: "+Number(processed).toLocaleString("en-US")+" از "+Number(total).toLocaleString("en-US");
  errorCount.textContent="خطا: "+Number(failed).toLocaleString("en-US");
  const percent=total>0?Math.max(0,Math.min(100,processed/total*100)):0;
  progressFill.style.width=percent+"%";
  progressTrack.setAttribute("aria-valuenow",String(Math.round(percent)));
  errorEl.textContent=toEnglishDigits(job.error||"");
}
window.localHarsiRender=render;
const nativeApp=Boolean(window.Capacitor?.isNativePlatform?.());
async function refreshStatus(){
  if(nativeApp){
    if(window.localHarsiBridge) render(window.localHarsiBridge.getStatus());
    return;
  }
  try{const response=await fetch("/api/status",{cache:"no-store"});render(await response.json());}
  catch{message.textContent="ارتباط با سرور برقرار نشد. صفحه را دوباره بارگذاری کنید.";}
}

button.addEventListener("click",async()=>{
  errorEl.textContent="";
  try{
    if(nativeApp){
      const bridge=await window.localHarsiReady;
      if(bridge.getStatus().status==="running"){
        await bridge.cancelNow();
        return;
      }
      if(selectedTimeframes.size===0) throw new Error("حداقل یک تایم‌فریم را انتخاب کنید.");
      button.disabled=true;
      render(await bridge.refreshNow([...selectedTimeframes]));
      return;
    }
    button.disabled=true;
    const response=await fetch("/api/refresh",{method:"POST"});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"شروع بروزرسانی ناموفق بود.");
    render(data.job);
  }catch(error){errorEl.textContent=toEnglishDigits(error.message);button.disabled=false;}
});
refreshStatus();
if(!nativeApp) setInterval(refreshStatus,3000);
</script>
<script type="module" src="./android-app.js"></script>
</body>
</html>
