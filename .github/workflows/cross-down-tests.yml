name: Cross Down Tests

on:
  push:
    branches:
      - feature/cross-down-vwap

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run automated tests
        run: npm test

      - name: Build web app
        run: npm run build
