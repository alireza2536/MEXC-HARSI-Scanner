name: Build Harsi Windows x86 and x64

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/windows-desktop.yml"
    branches:
      - android/local-harsi-app

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [ia32, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android/local-harsi-app
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web interface
        run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Harsi-Windows-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
