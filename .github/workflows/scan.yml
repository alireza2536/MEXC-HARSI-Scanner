name: MEXC HARSI 15m Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mexc-harsi-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Build, test, and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Run MEXC scan
        run: npm run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEXC_BASE_URL: ${{ vars.MEXC_BASE_URL }}
          TIMEFRAME: Min15
          MAX_PRICE_USDT: ${{ vars.MAX_PRICE_USDT || '30' }}
          HISTORY_DAYS: "3"
          MEXC_REQUEST_SPACING_MS: ${{ vars.MEXC_REQUEST_SPACING_MS || '125' }}
          UPSERT_BATCH_SIZE: ${{ vars.UPSERT_BATCH_SIZE || '500' }}
